# ==============================================================================
# Adonis Development Docker Compose Override (docker-compose.dev.yml)
# ==============================================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Exposes internal database and queue ports to localhost for direct tooling
# access (Compass, redis-cli, local IDE debugging).
# ==============================================================================

services:
  mongodb:
    ports:
      - "27017:27017"

  redis:
    ports:
      - "6379:6379"

  backend:
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev

  frontend:
    ports:
      - "5173:80"
