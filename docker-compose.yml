services:
  # Adonis Spring Boot Backend Service (Java 21)
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: adonis-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
      - MONGODB_URI=mongodb://mongodb:27017/adonis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_STREAM_NAME=adonis:execution:stream
      - REDIS_CONSUMER_GROUP=adonis-workers
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  # Adonis React Frontend Service (Vite + Nginx)
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: adonis-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  # MongoDB Persistence Service (Phase 1)
  mongodb:
    image: mongo:7.0
    container_name: adonis-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=adonis
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  # Redis Asynchronous Queue Service (Phase 7 & 7.1)
  redis:
    image: redis:7-alpine
    container_name: adonis-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mongo-data:
  redis_data:
