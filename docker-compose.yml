services:
  # Adonis Spring Boot Backend Service (Java 21)
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: adonis-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
      - MONGODB_URI=mongodb://mongodb:27017/adonis
    depends_on:
      - mongodb
    restart: unless-stopped

  # Adonis React Frontend Service (Vite + Nginx)
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: adonis-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  # MongoDB Persistence Service (Phase 1)
  mongodb:
    image: mongo:7.0
    container_name: adonis-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=adonis
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Infrastructure Services (Reserved for subsequent development phases)
  # ---------------------------------------------------------------------------

  # Redis (Scheduled for Phase 7: Redis Asynchronous Workers)
  # redis:
  #   image: redis:7.2-alpine
  #   container_name: adonis-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   restart: unless-stopped

volumes:
  mongo-data:
