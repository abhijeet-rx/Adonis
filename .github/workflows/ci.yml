name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-test:
    name: Backend Build & Test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run Tests
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw clean test

      - name: Archive Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: backend/target/surefire-reports
          retention-days: 7

  frontend-test:
    name: Frontend Lint & Build (Node.js 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck and Build
        working-directory: frontend
        run: npm run build

  security-scan:
    name: Security & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Frontend Dependency Vulnerability Audit
        working-directory: frontend
        run: npm audit --audit-level=high

  docker-smoke-test:
    name: Docker Deployment Validation & Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, security-scan]
    env:
      JWT_SECRET: smoke-test-production-jwt-secret-key-minimum-32-chars-long
      BACKEND_IMAGE: adonis-backend:${{ github.sha }}
      FRONTEND_IMAGE: adonis-frontend:${{ github.sha }}
      GIT_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Production Docker Images
        run: docker compose build --build-arg GIT_COMMIT=${{ github.sha }}

      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: adonis-backend:${{ github.sha }}
          format: 'table'
          exit-code: 0
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: adonis-frontend:${{ github.sha }}
          format: 'table'
          exit-code: 0
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Start Production Stack
        run: |
          docker compose up -d
          echo "Waiting for all production services to become healthy..."
          timeout 120s bash -c '
            services=("adonis-mongodb" "adonis-redis" "adonis-backend" "adonis-frontend")
            for svc in "${services[@]}"; do
              echo "Waiting for $svc..."
              until [ "$(docker inspect -f {{.State.Health.Status}} "$svc" 2>/dev/null)" = "healthy" ]; do
                status=$(docker inspect -f {{.State.Health.Status}} "$svc" 2>/dev/null || echo "not running")
                echo "  $svc current status: $status"
                sleep 2
              done
              echo "  $svc is healthy!"
            done
          '
          echo "=== All services reported healthy ==="
          docker compose ps

      - name: Output Service Status & Logs on Failure
        if: failure()
        run: |
          echo "=== Docker Compose Service Status ==="
          docker compose ps -a
          echo "=== Backend Logs ==="
          docker compose logs --tail=200 backend
          echo "=== Frontend Logs ==="
          docker compose logs --tail=200 frontend
          echo "=== Redis Logs ==="
          docker compose logs --tail=100 redis
          echo "=== MongoDB Logs ==="
          docker compose logs --tail=100 mongodb

      - name: Production Stack Smoke Test
        run: |
          echo "=== 1. Testing Frontend SPA on Port 80 ==="
          curl -sSf http://localhost/ | grep -q "Adonis" || (echo "Frontend root HTML test failed" && exit 1)

          echo "=== 2. Testing Frontend /healthz Endpoint ==="
          curl -sSf http://localhost/healthz

          echo "=== 3. Testing Backend /api/health through Nginx Reverse Proxy ==="
          HEALTH_JSON=$(curl -sSf http://localhost/api/health)
          echo "Health response: $HEALTH_JSON"
          echo "$HEALTH_JSON" | grep -q '"status":"UP"' || (echo "Backend health check failed" && exit 1)
          echo "$HEALTH_JSON" | grep -q '"service":"adonis-backend"' || (echo "Backend service name check failed" && exit 1)

          echo "=== 4. Testing Authentication API through Reverse Proxy ==="
          TEST_EMAIL="smoke-${GITHUB_RUN_ID:-local}-${RANDOM}@example.com"
          REGISTER_RES=$(curl -sSf -X POST http://localhost/api/auth/register \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"Smoke Tester\",\"email\":\"$TEST_EMAIL\",\"password\":\"Password123!\"}")
          echo "Register response: $REGISTER_RES"
          TOKEN=$(echo "$REGISTER_RES" | grep -o '"token":"[^"]*' | cut -d'"' -f4)
          if [ -z "$TOKEN" ]; then
            echo "Failed to obtain auth token"
            exit 1
          fi

          echo "=== 5. Testing Protected API /api/users/me ==="
          ME_RES=$(curl -sSf -H "Authorization: Bearer $TOKEN" http://localhost/api/users/me)
          echo "User profile: $ME_RES"
          echo "$ME_RES" | grep -q "$TEST_EMAIL" || (echo "Profile check failed" && exit 1)

          echo "=== 6. Creating Minimal Deterministic Workflow ==="
          WF_RES=$(curl -sSf -X POST http://localhost/api/workflows \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{
              "name": "Smoke Test Workflow",
              "description": "Deterministic workflow testing Redis Streams and Worker execution",
              "status": "ACTIVE",
              "nodes": [
                {
                  "id": "trigger-1",
                  "type": "trigger",
                  "data": { "label": "Start Trigger", "triggerType": "manual" },
                  "position": { "x": 100.0, "y": 100.0 }
                },
                {
                  "id": "step-1",
                  "type": "generic",
                  "data": { "label": "Process Step" },
                  "position": { "x": 300.0, "y": 100.0 }
                }
              ],
              "edges": [
                {
                  "id": "edge-1",
                  "source": "trigger-1",
                  "target": "step-1"
                }
              ]
            }')
          echo "Workflow response: $WF_RES"
          WORKFLOW_ID=$(echo "$WF_RES" | grep -o '"id":"[^"]*' | head -n1 | cut -d'"' -f4)
          if [ -z "$WORKFLOW_ID" ]; then
            echo "Failed to create workflow"
            exit 1
          fi
          echo "Created Workflow ID: $WORKFLOW_ID"

          echo "=== 7. Triggering Workflow Execution via Redis Streams ==="
          EXEC_RES=$(curl -sSf -X POST "http://localhost/api/workflows/$WORKFLOW_ID/execute" \
            -H "Authorization: Bearer $TOKEN")
          echo "Enqueue response: $EXEC_RES"
          EXECUTION_ID=$(echo "$EXEC_RES" | grep -o '"executionId":"[^"]*' | head -n1 | cut -d'"' -f4)
          if [ -z "$EXECUTION_ID" ]; then
            echo "Failed to enqueue workflow execution"
            exit 1
          fi
          echo "Enqueued Execution ID: $EXECUTION_ID"

          echo "=== 8. Polling Execution Status through Terminal State (SUCCESS) ==="
          FINAL_STATUS="UNKNOWN"
          for i in $(seq 1 30); do
            EXEC_DETAIL=$(curl -sSf -H "Authorization: Bearer $TOKEN" "http://localhost/api/executions/$EXECUTION_ID")
            CURRENT_STATUS=$(echo "$EXEC_DETAIL" | grep -o '"status":"[^"]*' | head -n1 | cut -d'"' -f4)
            echo "  [Poll $i/30] Execution status: $CURRENT_STATUS"
            if [ "$CURRENT_STATUS" = "SUCCESS" ]; then
              FINAL_STATUS="SUCCESS"
              echo "Execution details: $EXEC_DETAIL"
              break
            elif [ "$CURRENT_STATUS" = "FAILED" ]; then
              FINAL_STATUS="FAILED"
              echo "Execution failed unexpectedly: $EXEC_DETAIL"
              exit 1
            fi
            sleep 2
          done

          if [ "$FINAL_STATUS" != "SUCCESS" ]; then
            echo "Execution did not reach SUCCESS status within 60s timeout (final: $FINAL_STATUS)"
            exit 1
          fi

          echo "=== 9. Verifying MongoDB Execution History Persistence ==="
          HIST_RES=$(curl -sSf -H "Authorization: Bearer $TOKEN" "http://localhost/api/workflows/$WORKFLOW_ID/executions")
          echo "Execution history: $HIST_RES"
          echo "$HIST_RES" | grep -q "$EXECUTION_ID" || (echo "Execution history verification failed" && exit 1)
          echo "$HIST_RES" | grep -q '"status":"SUCCESS"' || (echo "Persisted status is not SUCCESS" && exit 1)

          echo "=== All Docker deployment smoke tests (including Redis Streams & Worker) passed successfully! ==="

      - name: Tear Down Stack
        if: always()
        run: docker compose down -v
