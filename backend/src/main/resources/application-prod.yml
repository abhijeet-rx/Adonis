# ==============================================================================
# Adonis Production Configuration Profile (SPRING_PROFILES_ACTIVE=prod)
# ==============================================================================
# Used when running inside production Docker containers or containerized clusters.
# Infrastructure services connect via Docker DNS service names (mongodb, redis)
# rather than localhost. All secrets and sensitive parameters are environment-driven.
# ==============================================================================

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: adonis-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    mongodb:
      # Defaults to Docker service name 'mongodb'
      uri: ${MONGODB_URI:mongodb://mongodb:27017/adonis}
      auto-index-creation: true
    redis:
      # Defaults to Docker service name 'redis'
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT_MS:5000}

adonis:
  jwt:
    # Required in production: 256-bit secret key (min 32 characters)
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  worker:
    enabled: ${WORKER_ENABLED:true}
    stream-name: ${REDIS_STREAM_NAME:adonis:execution:stream}
    consumer-group: ${REDIS_CONSUMER_GROUP:adonis-workers}
    consumer-name: ${REDIS_CONSUMER_NAME:}
    poll-timeout-ms: ${WORKER_POLL_TIMEOUT_MS:2000}
    pending-claim-idle-ms: ${WORKER_PENDING_CLAIM_IDLE_MS:60000}
    lease-duration-ms: ${WORKER_LEASE_DURATION_MS:60000}
    heartbeat-interval-ms: ${WORKER_HEARTBEAT_INTERVAL_MS:20000}
    queue-name: ${EXECUTION_QUEUE_NAME:adonis:execution:stream}
  queue:
    type: ${QUEUE_TYPE:redis}
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
    polling-interval-ms: ${SCHEDULER_POLLING_INTERVAL_MS:10000}
  webhook:
    max-body-size-bytes: ${WEBHOOK_MAX_BODY_SIZE_BYTES:1048576}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    timeout:
      connect-ms: ${AI_CONNECT_TIMEOUT_MS:10000}
      read-ms: ${AI_READ_TIMEOUT_MS:60000}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.adonis: ${LOGGING_LEVEL_ADONIS:INFO}
    org.springframework.data.mongodb: WARN
    org.springframework.data.redis: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
