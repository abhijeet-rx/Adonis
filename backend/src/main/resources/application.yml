server:
  port: 8080

spring:
  application:
    name: adonis-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/adonis}
      auto-index-creation: true

adonis:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
