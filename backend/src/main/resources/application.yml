server:
  port: 8080

spring:
  application:
    name: adonis-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/adonis}
      auto-index-creation: true

adonis:
  jwt:
    # 256-bit safe development default secret; must be overridden via JWT_SECRET in production
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
